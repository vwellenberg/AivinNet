name: Release
run-name: Release v${{ github.event.inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version number (without leading v)"
        required: true
        default: "2026.7.0"
      binary_build:
        description: "Build binaries (AppImage + PyInstaller)"
        required: true
        default: "true"
        type: choice
        options:
          - true
          - false
      is_draft:
        description: "Keep the release as a draft"
        required: true
        default: "true"
        type: choice
        options:
          - true
          - false
      prerelease:
        description: "Mark as pre-release (use for -rcN test runs)"
        required: true
        default: "false"
        type: choice
        options:
          - true
          - false
      is_latest:
        description: "Set as latest"
        required: true
        default: "false"
        type: choice
        options:
          - true
          - false
      build_docker:
        # Defaults to true since v2026.8.1: the README and the release notes
        # offer `ghcr.io/vwellenberg/aivinnet` as one of the supported ways to
        # install, and with this off a release quietly publishes no image at all.
        #
        # ⚠️ The `:latest` TAG still follows `is_latest`, which stays false by
        # default so an -rcN test run cannot claim it. A real release therefore
        # needs is_latest=true, or `:latest` keeps pointing at the previous one.
        description: "Build Docker image"
        required: true
        type: choice
        default: "true"
        options:
          - true
          - false

env:
  PIP_USE_PEP517: true

# Read-only by default (#300). Every job here runs third-party actions or
# fetches build tools, and without this key GITHUB_TOKEN gets the repository
# default — write access to code and releases in all of them. Write is granted
# per job, only to `upload-builds` (the release) and `docker` (the image);
# tests/test_packaging_manifests.py keeps it that way.
permissions:
  contents: read

jobs:
  build-client:
    runs-on: ubuntu-latest
    name: Build client
    steps:
      # The client lives in THIS repository since the two were merged. It used
      # to be cloned from `vwellenberg/AivinNet-Client` with no ref pinned,
      # which meant a release was not reproducible from its own tag: re-running
      # an old build picked up whatever the client's default branch had become.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 20
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 20.x

      - name: Install yarn
        run: |
          npm install -g yarn

      - name: Install dependencies & Build client
        run: |
          cd client
          yarn install --frozen-lockfile
          yarn build --outDir ../dist-client

      - name: Upload client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: "dist-client/"
          compression-level: 0
          name: "client"

  build-wheels:
    name: Build wheels
    runs-on: ubuntu-latest
    needs: [build-client]

    steps:
      - name: Checkout AivinNet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download client artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client
          path: client

      - name: Compress client and copy to src/aivinnet/client.zip
        run: |
          zip -r client.zip client
          rm -r client
          cp client.zip src/aivinnet/client.zip

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Local only: setuptools-scm reads the version from it. `-f` because
      # `fetch-depth: 0` brings the tag along once the release is published,
      # and a plain `git tag` then failed — re-running a release (say, after a
      # failed Docker push) stopped here before anything was rebuilt (#300).
      - name: Create git tag
        run: |
          git tag -f v${{ github.event.inputs.tag }}

      - name: Build wheels
        run: pip wheel . -w wheelhouse --no-deps

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ./wheelhouse/*.whl
          compression-level: 0
          name: "wheels"

      # ⚠️ The dependency versions the tests ran against, not whatever PyPI has
      # on release day (#300). `pip install aivinnet` resolved pyproject's open
      # ranges (`pillow>=11.1.0`) fresh, so a release could ship a library
      # version no CI run had seen. uv.lock is what `uv sync` and the API tests
      # use; exported once here, with hashes and platform markers, and every
      # binary build installs exactly this with `--require-hashes`. Exported
      # HERE so the macOS/Windows/ARM runners need no uv of their own.
      # `--locked`, not `--frozen`: a lock that no longer matches pyproject.toml
      # (a dependency added without `uv lock`) stops the release instead of
      # shipping without it. uv here and in the Dockerfile: the same pinned
      # version, bumped together.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.32"

      - name: Export the locked dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-header -o locked/runtime.txt
          uv export --locked --no-dev --no-emit-project --no-header --extra build -o locked/build.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ./locked/*.txt
          name: "locked-requirements"
          if-no-files-found: error

  build-appimage:
    name: Build Appimage
    runs-on: ${{ matrix.os }}
    # INFO: build-wheels is a hard dependency — this job downloads the `wheels`
    # artifact below. With `needs: [build-client]` only, it raced ahead and died
    # with "Unable to find any artifacts for the associated workflow".
    needs: [build-client, build-wheels]
    if: ${{ github.event.inputs.binary_build == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]

    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install linux dependencies
        run: sudo apt-get install libev-dev libfuse-dev -y > /dev/null

      - name: Checkout AivinNet
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          sparse-checkout: appimage

      - name: Set architecture-specific variables
        run: |
          if ${{ endsWith(matrix.os, 'arm') }}; then
            echo "APPIMAGE_ARCH=aarch64" >> $GITHUB_ENV
          else
            echo "APPIMAGE_ARCH=x86_64" >> $GITHUB_ENV
          fi

      # ⚠️ Both tools build the AppImage that `install.sh` hands to every user,
      # so neither may change under us (#300). python-appimage by version (a
      # PyPI version is immutable); appimagetool by checksum, because its only
      # download is the moving `continuous` release. AppImageKit is archived,
      # the asset has not changed since 2023-03-08: a different file now means
      # a different tool, and the build stops instead of shipping it.
      - name: Install appimage builder
        run: |
          pip install "python-appimage==1.4.6"
          wget -nv -c "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-$APPIMAGE_ARCH.AppImage"
          case "$APPIMAGE_ARCH" in
            x86_64)  expected=b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2 ;;
            aarch64) expected=a48972e5ae91c944c5a7c80214e7e0a42dd6aa3ae979d8756203512a74ff574d ;;
            *) echo "::error::no appimagetool checksum for $APPIMAGE_ARCH"; exit 1 ;;
          esac
          echo "$expected  appimagetool-$APPIMAGE_ARCH.AppImage" | sha256sum -c - \
            || { echo "::error::appimagetool-$APPIMAGE_ARCH.AppImage is not the reviewed build"; exit 1; }
          chmod +x "appimagetool-$APPIMAGE_ARCH.AppImage"

      - name: Download client artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client
          path: client

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: wheels
          merge-multiple: true

      - name: Download the locked dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: locked-requirements
          path: locked

      # INFO: --no-index keeps this build offline-deterministic. While the
      # distribution was still called `swingmusic`, this flag was load-bearing:
      # upstream publishes that name on PyPI, pip compared our fresh wheel
      # against theirs and took whichever version sorted higher, so a tag below
      # theirs silently baked the UPSTREAM backend into an AivinNet AppImage —
      # our client, their API, no device sync and no playlist endpoints. Since
      # the rename to `aivinnet` there is no such package on PyPI (checked:
      # 404), but the name is unclaimed and anyone could take it, so the flag
      # stays. Runtime deps come from uv.lock (step below), not from PyPI's latest.
      #
      # INFO: The AppDir path is DISCOVERED, never spelled out. python-appimage
      # names it after `Name=` in appimage/aivinnet.desktop (-> AivinNet-x86_64),
      # not after -n (-> aivinnet-x86_64). Writing the lower-case name here made
      # `pip install --target` create a SECOND, empty directory, so appimagetool
      # got one without a desktop file and aborted with "Desktop file not found"
      # while the real AppDir sat next to it, missing both aivinnet and libev.
      # Renaming the app in the .desktop file would break it again — an AppDir is
      # identified by containing AppRun, so that is what we look for.
      - name: Build AppDir
        run: |
          python-appimage build app -p 3.11 appimage/ -n "aivinnet-$APPIMAGE_ARCH" -x client --no-packaging

          mapfile -t appdirs < <(find . -mindepth 1 -maxdepth 1 -type d -exec test -e '{}/AppRun' \; -print)
          if [ "${#appdirs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one AppDir (a directory containing AppRun), found ${#appdirs[@]}: ${appdirs[*]}"
            exit 1
          fi
          APPDIR="${appdirs[0]}"
          echo "APPDIR=$APPDIR" >> $GITHUB_ENV
          echo "Using AppDir: $APPDIR"

          # The locked dependencies, with hashes, by the AppDir's own interpreter
          # (#300). Not through python-appimage's requirements.txt: that runs
          # `pip install -U <line>` per line, which can check no hash and
          # upgrades past any pin. APPDIR absolute for this one call: the
          # AppDir's sitecustomize then rewrites the installed scripts'
          # shebangs to relative ones, as it did for its own installs (it only
          # acts when sys.prefix is $APPDIR/opt/python3.11).
          APPDIR="$(realpath "$APPDIR")" "$APPDIR/opt/python3.11/bin/python3.11" -I -m pip install \
            --no-warn-script-location --require-hashes -r locked/runtime.txt

          pip install --target "$APPDIR/opt/python3.11/lib/python3.11/" \
            --no-deps --no-index --find-links=wheels/ aivinnet

      # INFO: bjoern is compiled from source against libev on this runner and
      # links to libev.so.4 dynamically. python-appimage bundles only Python +
      # site-packages, NOT system libraries — without this step the AppImage
      # dies with an ImportError unless the user installs libev4 themselves.
      # appimage/entrypoint.sh puts $APPDIR/usr/lib on LD_LIBRARY_PATH so this
      # copy is the one that gets loaded.
      - name: Bundle libev into the AppDir
        run: |
          libev="$(ldconfig -p | awk '/libev\.so\.4/ {print $NF; exit}')"
          if [ -z "$libev" ]; then
            echo "::error::libev.so.4 not found on the runner — cannot bundle it"
            exit 1
          fi
          mkdir -p "$APPDIR/usr/lib"
          cp -Lv "$libev" "$APPDIR/usr/lib/libev.so.4"

      # INFO: Proves the AppDir is the assembled one before it gets sealed into a
      # read-only image. Both files are absent from the decoy directory that the
      # old hard-coded path produced, so this fails loudly instead of publishing
      # an AppImage that dies on first start.
      - name: Verify the AppDir is complete
        run: |
          # `ls`, not `test -e`: an unquoted glob that matches more than once
          # turns `test -e a b` into "binary operator expected" — a crash where a
          # check was meant to be.
          ls "$APPDIR"/*.desktop >/dev/null 2>&1 \
            || { echo "::error::no .desktop in $APPDIR"; exit 1; }
          test -d "$APPDIR/opt/python3.11/lib/python3.11/aivinnet" \
            || { echo "::error::aivinnet not installed into $APPDIR"; exit 1; }
          test -f "$APPDIR/usr/lib/libev.so.4" \
            || { echo "::error::libev not bundled into $APPDIR"; exit 1; }
          test -d "$APPDIR/client" || { echo "::error::web client missing from $APPDIR"; exit 1; }
          # appimage/entrypoint.sh execs this interpreter directly; without it
          # the server would run as a child of python-appimage's wrapper and
          # outlive a `kill` of the AppImage (#300).
          # Same lookup as the entrypoint: opt/python3.X/bin/python3.X, executable.
          interpreter=""
          for dir in "$APPDIR"/opt/python3.*; do
            if [ -x "$dir/bin/${dir##*/}" ]; then interpreter="$dir/bin/${dir##*/}"; fi
          done
          test -n "$interpreter" \
            || { echo "::error::no interpreter under $APPDIR/opt for entrypoint.sh to exec"; exit 1; }
          echo "AppDir complete: $APPDIR"

      - name: Package AppImage
        run: |
          ./appimagetool-$APPIMAGE_ARCH.AppImage --no-appstream \
            "$APPDIR" \
            "aivinnet-v${{ github.event.inputs.tag }}-$APPIMAGE_ARCH.AppImage"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: ./aivinnet-*.AppImage
          compression-level: 0
          name: appimage-${{ env.APPIMAGE_ARCH }}
          if-no-files-found: error

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    # The image builds and bundles its own client from this checkout (Dockerfile,
    # stage `client`) — it no longer downloads one from the release, so its UI
    # does not depend on the release being visible. It still waits for
    # `upload-builds` and refuses drafts (below) so a published image never
    # precedes its release. Set **is_latest=true** for a real release, or
    # `:latest` (which every doc points at) keeps pointing at the old image.
    needs: [build-client, build-wheels, upload-builds]
    # Only what this job actually does: read the checkout, push the image to
    # ghcr. `write-all` additionally handed it write access to the repository
    # itself — to code, releases and everything else — which nothing here uses.
    permissions:
      contents: read
      packages: write
    if: ${{ github.event.inputs.build_docker == 'true' }}

    steps:
      # A public image for a release nobody can see yet (drafts are hidden from
      # the anonymous API) is a version without notes or downloads. Until the
      # client was bundled this also made every container fetch the PREVIOUS
      # release's UI into its volume; that part is gone, the guard stays.
      - name: Refuse to publish an image for a hidden release
        if: ${{ github.event.inputs.is_draft == 'true' }}
        run: |
          echo "::error::build_docker=true needs is_draft=false — the image would be public before its release is."
          exit 1

      - name: Checkout into repo
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      # INFO: Container registries reject upper-case image names, and this repo
      # is `vwellenberg/AivinNet` — using ${{ github.repository }} verbatim
      # makes the push fail.
      - name: Compute image tags
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          tags="$image:v${{ github.event.inputs.tag }}"
          if [ "${{ github.event.inputs.is_latest }}" = "true" ]; then
            tags="$tags,$image:latest"
          fi
          echo "IMAGE_TAGS=$tags" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@27d0a4f181a40b142cce983c5393082c365d1480 # v1.2.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1.7.0

      - name: Login to GHCR
        uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1.14.1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64, linux/arm64 #,linux/arm
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          labels: org.opencontainers.image.title=AivinNet
          # ⚠️ The image's ONLY version source — the Dockerfile's `ARG app_version`
          # writes it into the pip metadata. An arg the Dockerfile does not declare
          # is dropped without a word; tests/test_packaging_manifests.py checks both
          # ends (TestImageVersion).
          build-args: |
            app_version=${{github.event.inputs.tag}}

  build-pyinstaller:
    name: Build binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build-client, build-wheels]
    if: ${{ github.event.inputs.binary_build == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-22.04,
            ubuntu-22.04-arm,
            windows-latest,
            windows-11-arm,
            # macos-13,
            macos-latest,
          ]

    steps:
      - name: Checkout AivinNet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            aivinnet.spec
            src/aivinnet/assets

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.x"

      - name: Download client artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client
          path: client

      - name: Compress client (Unix)
        if: runner.os != 'Windows'
        run: |
          zip -r client.zip client

      - name: Compress client (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path client -DestinationPath client.zip -Force

      - name: Download wheel artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: wheels
          merge-multiple: true

      - name: Download the locked dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: locked-requirements
          path: locked

      # install system packages
      #
      # ⚠️ `Homebrew/actions/setup-homebrew@master` used to sit here and was
      # removed rather than pinned. Two reasons, and the first is the one that
      # matters: `@master` is a BRANCH, so every release run fetched whatever
      # that repository happened to contain at that moment and executed it here.
      # A moving tag is a risk; a branch is a certainty that the code changes.
      #
      # The second is that it was not needed. GitHub's macOS runners ship
      # Homebrew preinstalled, so `brew install` below works without setting
      # anything up. Deleting a dependency beats pinning one.
      #
      # If a future runner image drops Homebrew, put the action back — but with
      # a commit SHA, not a branch.
      - name: Install libev (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install libev

      - name: Install libev (Linux)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get install libev-dev -y > /dev/null

      # INFO: The dependencies (runtime + pyinstaller) exactly as uv.lock pins
      # them, with hashes (#300); then the local wheel with the index switched
      # off, so nothing from PyPI can win the version comparison (see the
      # --no-index comment in build-appimage).
      - name: Install AivinNet
        run: |
          pip install --require-hashes -r locked/build.txt
          pip install --no-index --no-deps --find-links=wheels/ aivinnet

      - name: Build with Pyinstaller on ${{ matrix.os }}
        run: pyinstaller aivinnet.spec

      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pyinstaller-${{ matrix.os }}
          path: ./dist/aivinnet_*
          compression-level: 0
          if-no-files-found: error

  upload-builds:
    name: Uploading builds to release
    runs-on: ubuntu-latest
    needs: [build-client, build-wheels, build-pyinstaller, build-appimage]
    # INFO: build-pyinstaller and build-appimage are skipped when binary_build
    # is false, and a skipped `needs` skips the dependent job as well — which
    # meant "no release at all, every job green". Accept skipped, never accept
    # failed or cancelled.
    if: >-
      ${{ !cancelled()
      && needs.build-client.result == 'success'
      && needs.build-wheels.result == 'success'
      && (needs.build-pyinstaller.result == 'success' || needs.build-pyinstaller.result == 'skipped')
      && (needs.build-appimage.result == 'success' || needs.build-appimage.result == 'skipped') }}
    permissions:
      contents: write

    steps:
      - name: Checkout AivinNet
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            .github/changelog.md

      - name: Download client artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client
          path: client

      - name: compress client
        run: |
          zip -r client.zip client
          rm -r client

      - name: Download wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels
          path: wheels
          merge-multiple: true

      - name: Download all Pyinstaller builds
        if: ${{ github.event.inputs.binary_build == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Pyinstaller-*
          path: pyinstaller
          merge-multiple: true

      - name: Download AppImages build
        if: ${{ github.event.inputs.binary_build == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: appimage*
          path: appimage
          merge-multiple: true

      # INFO: Everything ends up in one flat directory so SHA256SUMS lists bare
      # asset names — install.sh downloads a single asset and verifies it
      # against this file, so the names have to match the release assets.
      - name: Collect assets and generate SHA256SUMS
        run: |
          mkdir -p release
          cp client.zip release/
          cp wheels/* release/
          # Binary directories are absent on a binary_build=false run.
          for dir in pyinstaller appimage; do
            if [ -d "$dir" ]; then
              cp "$dir"/* release/
            fi
          done
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts to GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          draft: ${{ github.event.inputs.is_draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          name: ${{ format('v{0}',github.event.inputs.tag) }}
