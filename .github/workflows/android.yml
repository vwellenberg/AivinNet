name: Android

# The Android Auto prototype (android/). Path-filtered, and deliberately NOT a required
# check: a skipped required check never reports, so a Python-only change would wait for
# ever. The job runs only when android/ or this file changes, and nothing else waits on it.
on:
  pull_request:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # By hand (Actions → Android → Run workflow, on master): the signed APK right after the
  # signing secrets were added, without waiting for the next change under android/.
  workflow_dispatch:

# Read-only, like every other workflow here (see tests/test_packaging_manifests.py).
permissions:
  contents: read

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk is 37.2 (okhttp-android 5.5.1 requires API 37+); the runner image
      # does not guarantee that platform, so install it explicitly. `yes` answers a
      # license prompt, which would otherwise hang the job until its timeout. It sits in
      # `(… || true)`: Actions runs bash with pipefail, and `yes` ends on SIGPIPE (141).
      - name: Install Android platform 37.2
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.2'

      - name: Build and unit-test
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aivinnet-auto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The APK to install on the phone: signed with the fixed key, so it installs over the
      # previous one and keeps the login and the offline downloads. Never for pull requests, and
      # only once the secrets exist; until then this says so and the debug APK stays the only one.
      # The keystore is written to the runner's temp dir and never uploaded.
      - name: Build signed APK
        # master only, also for the manual trigger: a branch's code must not get the release key.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AIVINNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AIVINNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AIVINNET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing key in the secrets (ANDROID_KEYSTORE_BASE64): no signed APK. See android/README.md."
            exit 0
          fi
          export AIVINNET_KEYSTORE_FILE="$RUNNER_TEMP/aivinnet-release.jks"
          trap 'rm -f "$AIVINNET_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$AIVINNET_KEYSTORE_FILE"
          ./gradlew assembleRelease --no-daemon --console=plain
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && hashFiles('android/app/build/outputs/apk/release/app-release.apk') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aivinnet-auto-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
