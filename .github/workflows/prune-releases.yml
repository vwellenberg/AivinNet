# Remove old GitHub releases, keep the newest ones (Actions → Prune releases → "Run workflow").
#
# Only the RELEASES go: their page and their files. The git tags stay, so every version can
# still be rebuilt from its tag (build.yml), and the Docker images in ghcr are not touched.
# What stops working for a removed release is `install.sh --version <that tag>`, because it
# downloads the release's files; a normal install and `--update` take the newest release.
#
# Drafts count as old: a draft is never one of the kept releases.
#
# `dry_run` is on by default: a run then only lists what it would remove. The logic lives in
# scripts/prune-releases.sh, which the Release workflow runs too: since 2026-11-07 every published
# "latest" release removes the ones before it on its own (build.yml). This button is for the rest.
name: Prune releases

on:
  workflow_dispatch:
    inputs:
      keep:
        description: "How many of the newest published releases to keep"
        required: true
        default: "1"
      dry_run:
        description: "Only list what would be removed"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    concurrency:
      group: prune-releases
      cancel-in-progress: false
    permissions:
      contents: write # deletes releases, nothing else
    steps:
      - name: Checkout AivinNet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove all but the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Through the environment, never interpolated into the script: an input is text someone typed.
          KEEP: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash scripts/prune-releases.sh "$REPO" "$KEEP" "$DRY_RUN"
