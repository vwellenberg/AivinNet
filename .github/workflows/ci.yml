name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Ruff check
        run: uvx ruff check src/ tests/

      - name: Ruff format check
        run: uvx ruff format --check src/ tests/

      - name: Mypy type check (strict modules)
        run: >-
          uvx --with xxhash --with unidecode --with pendulum mypy
          src/aivinnet/utils/hashing.py
          src/aivinnet/utils/dates.py
          src/aivinnet/utils/parsers.py
          src/aivinnet/utils/__init__.py
          src/aivinnet/lib/playlist_maintenance.py
          --config-file pyproject.toml

      # These two shell scripts are shipped, not internal tooling: install.sh is
      # what users pipe into bash, and entrypoint.sh is the AppImage's first
      # instruction. Neither is exercised by the Python test suite, so lint them
      # here (shellcheck is pre-installed on the runner image).
      - name: Shellcheck shipped scripts
        run: |
          shellcheck install.sh
          shellcheck --shell=sh appimage/entrypoint.sh

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # Hand-picked dependency set. The truly heavy deps (Flask / SQLAlchemy /
      # Pillow) are mocked at import time by the test modules themselves, so they
      # are intentionally NOT installed. mutagen + tinytag ARE installed: they are
      # pure-Python (no libev/bjoern build) and the real-bytes tag round-trip test
      # needs them. conftest pre-imports them so the sibling fallback mocks no-op.
      # Coverage uses a stable whole-package denominator (see [tool.coverage.run]
      # in pyproject.toml); the floor only guards against gross test removal.
      - name: Run unit tests
        run: >-
          uvx --with xxhash --with unidecode --with pendulum --with requests
          --with 'mutagen<2' --with 'tinytag<3' --with pytest-cov
          pytest tests/ -v
          --cov --cov-report=term-missing --cov-fail-under=10

  api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      # bjoern (WSGI server) is a hard dependency and needs libev to build.
      - name: Install libev
        run: sudo apt-get update && sudo apt-get install -y libev-dev

      - name: Install dependencies
        run: uv sync

      # Full-stack request-cycle tests (real flask_openapi3, real request
      # models). This lane exists because the request-model layer broke twice
      # in one day (#36 -> #167/#39) in ways no mocked unit test could see:
      # multipart optionality and file mapping only misbehave in real requests.
      - name: Run API tests
        run: uv run --with pytest pytest tests_api/ -v

  # Builds the image and starts it, because the image is what Docker users get
  # and nothing else here ever ran it. Every test above reads `src/` from the
  # checkout, so an image missing its assets or pointing its tools at the
  # wrong data directory passed all of them. Only the release workflow built the
  # image — and it never started it.
  docker:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built the way the release builds it: with `app_version`. A pre-release
      # with a leading `v` on purpose — the metadata normalises it to `1.2.3rc4`,
      # and the check below pins that the arg arrives at all (#192: it did not,
      # the Dockerfile had no ARG and Docker dropped it without a word).
      - name: Build image
        run: docker build --build-arg app_version=v1.2.3-rc4 -t aivinnet-smoke .

      # From a workdir that is NOT /app: the version used to be read from a
      # `version.txt` relative to the working directory, and `-w /tmp` crashed.
      - name: Version comes from the build-arg, not the working directory
        run: |
          set -euo pipefail
          version=$(docker run --rm -w /tmp aivinnet-smoke --version)
          echo "$version"
          if [ "$version" != "aivinnet v1.2.3rc4" ]; then
            echo "::error::image reports '$version', built with app_version=v1.2.3-rc4"; exit 1
          fi

      - name: Start, log in, fetch fallback images, reset the password
        run: |
          set -euo pipefail
          mkdir -p music config/aivinnet/client
          # A stub client: the real one is downloaded from GitHub on first start,
          # and an API rate limit must not be able to fail this job.
          echo '<!doctype html><title>stub</title>' > config/aivinnet/client/index.html

          docker run -d --name smoke -p 1970:1970 \
            -v "$PWD/music:/music" -v "$PWD/config:/config" aivinnet-smoke

          for _ in $(seq 1 60); do
            docker logs smoke 2>&1 | grep -q "Data folder" && break
            sleep 2
          done
          logs=$(docker logs smoke 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          echo "$logs"

          # Not `! grep`: a negated command never trips `set -e`.
          if grep -q "Assets dir could not be found" <<< "$logs"; then
            echo "::error::image ships without src/aivinnet/assets"; exit 1
          fi
          if grep -qE 'http://172\.' <<< "$logs"; then
            echo "::error::banner lists the container bridge address"; exit 1
          fi
          if ! grep -q 'AivinNet v1.2.3rc4' <<< "$logs"; then
            echo "::error::the running server does not report the build-arg version"; exit 1
          fi
          password=$(grep -oP 'password: \K\S+' <<< "$logs")

          # The banner is printed BEFORE the library loads and the port binds.
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:1970/ && break
            sleep 2
          done

          curl -sf -c cookies -o /dev/null -X POST http://127.0.0.1:1970/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$password\"}"

          for img in thumbnail/small/missing.webp artist/small/missing.webp; do
            test "$(curl -s -b cookies -o /dev/null -w '%{content_type}' "http://127.0.0.1:1970/img/$img")" = image/webp
          done

          # Run bare, as the startup banner tells people to — it has to change
          # the password of THIS server, not of a second instance in /root.
          printf 'admin\nsmoke-reset-pw\n' | docker exec -i smoke aivinnet --password-reset
          curl -sf -c cookies -o /dev/null -X POST http://127.0.0.1:1970/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-reset-pw"}'

          # The first-run folder choice has to survive a restart — every Docker
          # upgrade is one. It used to live in memory only on a fresh install.
          curl -sf -b cookies -o /dev/null -X POST http://127.0.0.1:1970/notsettings/add-root-dirs \
            -H 'Content-Type: application/json' -d '{"new_dirs":["/music"],"removed":[]}'
          docker restart smoke
          for _ in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:1970/ && break
            sleep 2
          done
          curl -sf -c cookies -o /dev/null -X POST http://127.0.0.1:1970/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-reset-pw"}'
          dirs=$(curl -sf -b cookies http://127.0.0.1:1970/notsettings/get-root-dirs)
          echo "root dirs after restart: $dirs"
          if ! grep -q '"/music"' <<< "$dirs"; then
            echo "::error::music folder chosen on first run was lost on restart"; exit 1
          fi

      # `docker stop` sends SIGTERM, and the app is PID 1: without a handler of
      # its own the kernel drops the signal, Docker waits out its 10 s grace
      # period and SIGKILLs — exit 137, on every stop and every update, with the
      # SQLite database open in WAL mode. Stopped WITH an idle keep-alive
      # connection open, like any browser tab: bjoern waits for that one without
      # a timeout, which a stop on a quiet server would never show.
      - name: Stop is clean — SIGTERM handled, database closed
        run: |
          set -euo pipefail
          exec 3<>/dev/tcp/127.0.0.1/1970
          printf 'GET / HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3
          sleep 1

          start=$(date +%s%N)
          docker stop smoke
          took_ms=$(( ($(date +%s%N) - start) / 1000000 ))
          exec 3>&-
          code=$(docker inspect -f '{{.State.ExitCode}}' smoke)
          echo "docker stop took ${took_ms} ms, exit code ${code}"
          docker logs --tail 5 smoke

          if [ "$code" != 0 ] && [ "$code" != 143 ]; then
            echo "::error::exit code $code after docker stop (137 = SIGKILLed after the grace period)"; exit 1
          fi
          # The drain deadline is 3 s; a SIGKILL would take the full 10.
          if [ "$took_ms" -gt 6000 ]; then
            echo "::error::docker stop took ${took_ms} ms, the grace period is 10 s"; exit 1
          fi
          # Closing the last connection folds the WAL back into the database.
          if [ -e config/aivinnet/aivinnet.db-wal ]; then
            echo "::error::database left open: aivinnet.db-wal still there after the stop"; exit 1
          fi

      - name: Container log on failure
        if: failure()
        run: docker logs smoke || true

  # ---------------------------------------------------------------------------
  # Web client. Same repository since the merge, its own toolchain.
  #
  # ⚠️ Deliberately WITHOUT a `paths:` filter, on either half. A required check
  # that is skipped never reports at all, and a pull request waiting for it
  # waits for ever — the cheapest monorepo trap there is. Four short Node jobs
  # on a Python-only change is the price, and it is a low one.
  # ---------------------------------------------------------------------------
  client-lint:
    name: Client Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint check
        run: yarn lint:check

  client-typecheck:
    name: Client Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: vue-tsc check
        run: yarn typecheck

  client-test:
    name: Client Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: client/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
