# Keeps the pins fresh (#300). The workflows reference every action by commit
# SHA (a tag like `v1` can be moved to other code by whoever controls that
# repository, and a release job runs it with write access), so updates no
# longer arrive by themselves: Dependabot opens one grouped PR a week with the
# new SHAs and their version comments, CI checks it, and it is merged like any
# other PR.
#
# The same goes for the libraries: without an entry here Dependabot only raises
# alerts and never a PR, and Pillow sat 35 advisories behind until an audit
# found it (#573). Minor and patch updates arrive as one grouped PR per
# ecosystem, majors one at a time, because a major is the one that needs a look.
# The cooldown keeps a release out until it is a week old (a hijacked release is
# usually pulled within days); security updates skip it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Backend. `increase`: the floors in pyproject.toml move with uv.lock, so the
  # declared ranges never admit a version the lock has long left behind (they
  # stood at pillow>=11.1.0 while uv.lock had 13.0.0). GitHub's alerts resolve
  # uv.lock exactly (see its SBOM); the floors are about honesty, not alerts.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps

  # Client (yarn v1, the lockfile tells Dependabot which manager to run).
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      client:
        update-types: ["minor", "patch"]
    # auto-animate restarted its versions at 0.x; the old 1.0.0-* prereleases rank above 0.10
    # in semver, and "1.0.0-pre-alpha.3" (2022) even above "1.0.0-beta.5", so Dependabot offered
    # downgrades (#753).
    ignore:
      # TypeScript 7 is the native (Go) compiler; vue-tsc and typescript-eslint do not run on
      # it yet (#768: lint and typecheck fail). Revisit when vue-tsc supports it.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      - dependency-name: "@formkit/auto-animate"
        versions: [">=1.0.0-0 <1.0.0"]
      # components/shared/TypedDynamicScroller.vue rebuilds the library's DynamicScroller on its
      # own `useDynamicScroller` (#704), so its props, slots and the composable's return values
      # are copied. Patches come by themselves; a minor or major gets an explicit PR that compares
      # the wrapper against the new library source first.
      - dependency-name: vue-virtual-scroller
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: deps(client)

  # The Android prototype (android/): Gradle wrapper, version catalog and Maven dependencies.
  # Minor/patch as one group, majors one at a time, the same cooldown as the others.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      android:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps(android)

  # The MCP server (mcp_server/) has its own requirements.txt and no lock.
  - package-ecosystem: pip
    directory: /mcp_server
    schedule:
      interval: weekly
    versioning-strategy: increase
    cooldown:
      default-days: 7
    groups:
      mcp-server:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: deps(mcp)
