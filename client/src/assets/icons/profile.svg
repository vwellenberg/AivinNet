<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
    <!-- Chrome set: a person in a ring — YOUR account. `artist.svg` (bare head
         and shoulders) is a person in the library and `users.svg` (two) the
         other accounts; the ring keeps this one apart from both in the same
         list. Stands in for the profile picture until one is uploaded. -->
