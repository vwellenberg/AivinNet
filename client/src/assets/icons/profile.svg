    <path d="M12 7.2a2.9 2.9 0 1 1 0 5.8 2.9 2.9 0 0 1 0-5.8Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M6.7 18.4c.9-2 3-3.1 5.3-3.1s4.4 1.1 5.3 3.1" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
