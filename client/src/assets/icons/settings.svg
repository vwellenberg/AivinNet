<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
    <!-- Chrome set: rim, eight stubby teeth, hub. Drawn as strokes rather than
         a toothed silhouette — the fine cut-outs of the SF-derived gear it
         replaces turned to mush at 18px. The teeth deliberately START INSIDE
         the rim (r 5.4 against the rim's outer edge at 6.0): detached teeth
         read as a sun, and the app already has a sun for the theme toggle. -->
