<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
    <!-- Chrome set: the sewing pin, stuck in at an angle. A ball head (r=4.2
         about 15.6/8.4, ink 10.2..21 x 3..13.8) and a needle that leaves the
         head along the 45-degree diagonal and tapers to a point at 4.4/19.6.
         The needle is a FILLED wedge, not a 2.4 stroke: a stroke of even width
         read as a matchstick or a key, the taper is what says "pin". It starts
         at the head ring, not its centre, so it never shows inside the hollow
         head. The head comes first: the lone-glyph test reads its stroke. -->
    <path d="M11.4 8.4a4.2 4.2 0 1 0 8.4 0a4.2 4.2 0 1 0 -8.4 0Z" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M13.41 12.15L4.4 19.6L11.85 10.59Z" fill="currentColor" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round" />
</svg>
