# AivinNet — self-hosted music server
#
#   echo AIVINNET_MUSIC_DIR=/path/to/your/music > .env
#   docker compose up -d
#   docker compose logs aivinnet     admin password, printed once on the first start
#
# then open http://localhost:1970 and log in as `admin`.
#
# Two directories matter and both are mounted below: your music, and the
# directory AivinNet keeps everything else in (database, covers, playlists).

services:
  aivinnet:
    image: ghcr.io/vwellenberg/aivinnet:latest
    container_name: aivinnet
    restart: unless-stopped

    ports:
      - "1970:1970"

    volumes:
      # Your music. Point the left side at your own library.
      #
      # NOT read-only on purpose: editing tags writes back into the files, and
      # lyrics fetched online are saved as .lrc next to the track. Add `:ro` if
      # you would rather have neither than let the container write there.
      # Required: left as a relative default Docker
      # would silently create an empty ./music and the server would come up
      # healthy with an empty library and nothing to explain it.
      - ${AIVINNET_MUSIC_DIR:?point this at your music folder}:/music

      # Everything AivinNet owns: database, covers, playlists, settings.
      # ⚠️ This is the only copy of that data — back up `./config/aivinnet`.
      # (The app creates that subdirectory itself.)
      - ./config:/config

    environment:
      # Optional. Left empty, the server generates a random admin password on
      # its very first start and prints it ONCE to the container log:
      #     docker compose logs aivinnet
      # It is not stored anywhere else — and the log is gone as soon as the
      # container is recreated (`docker compose pull && up -d`), so write it
      # down, then change it in the profile screen if you want your own.
      #
      # To choose it yourself instead, set it BEFORE the first start (export it
      # or put it in the `.env` next to this file). It is only read while the
      # admin account is created and ignored from then on.
      #
      # ⚠️ There is no default password to fall back to, and that is what makes
      # an empty value safe here. Up to v2026.8.1-rc1 the app shipped `admin`, which
      # is why this line used to refuse to start without a value.
      - AIVINNET_ADMIN_PASSWORD=${AIVINNET_ADMIN_PASSWORD:-}

      # - TZ=Europe/Berlin

    # The container runs as root, so files under ./config end up owned by root.
    #
    # ⚠️ To run as yourself, create and chown the directories FIRST:
    #     mkdir -p config music && sudo chown -R 1000:1000 config
    # Docker creates a missing bind path as root:root, and a non-root container
    # then cannot create its data directory inside it — the container crashes on
    # start and `restart: unless-stopped` retries it for ever.
    # user: "1000:1000"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:1970/', timeout=5)\""]
      interval: 1m
      timeout: 10s
      # The first start downloads the web client and scans the library, which
      # takes a while on a big collection — don't let that count as unhealthy.
      start_period: 10m
      retries: 3
